<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Item — bitsettled.com</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="apple-theme.css">
<link rel="stylesheet" href="legal.css">
<style>
  .item-wrap{max-width:980px;margin:0 auto;padding:24px 0 60px}
  .item-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
  .item-title{font-size:clamp(28px,4.5vw,44px);line-height:1.06;letter-spacing:-.035em;margin:6px 0 6px}
  .item-sub{font-size:12px;color:#6e6e73}
  .item-price{font:650 22px var(--mono);color:#0071e3;margin-top:10px}
  .item-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#d2d2d7;border:1px solid #d2d2d7;border-radius:12px;overflow:hidden;margin-top:14px}
  .item-fact{background:#fff;padding:9px 11px}
  .item-label{font:700 8px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#86868b}
  .item-value{font:600 11px var(--mono);color:#1d1d1f;margin-top:3px;overflow-wrap:anywhere}
  .item-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .comment-list{margin-top:14px}
  .comment-row{display:grid;grid-template-columns:38px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid #d2d2d7}
  .comment-row:last-child{border-bottom:0}
  .comment-votes{display:flex;flex-direction:column;align-items:center;gap:1px;font:700 11px var(--mono);color:#6e6e73}
  .comment-votes button{border:0;background:#f5f5f7;border-radius:99px;width:26px;height:22px;cursor:pointer;color:#6e6e73;font-size:10px}
  .comment-votes button:hover{background:#e8e8ed;color:#0071e3}
  .comment-meta{font:600 8.5px var(--mono);text-transform:uppercase;letter-spacing:.04em;color:#86868b;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .comment-kind{color:#0071e3;border:1px solid rgba(0,113,227,.3);border-radius:99px;padding:2px 6px}
  .comment-text{font-size:12.5px;line-height:1.6;color:#1d1d1f;margin-top:3px}
  .comment-price{font:700 13px var(--mono);color:#0071e3;margin-left:auto}
  .comment-accept{margin-top:5px;border:1px solid rgba(0,113,227,.3);background:#e8f1fb;color:#0066cc;border-radius:99px;padding:3px 8px;font:700 8px var(--mono);cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
  .item-form{display:grid;grid-template-columns:130px 130px minmax(0,1fr) 95px auto;gap:6px;margin-top:12px;align-items:center}
  .item-form .input{font-size:11px}
  .item-deal{border:1px solid #b8d8f4;background:#e8f1fb;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:12px;color:#0066cc}
  .item-deal b{color:#1d1d1f}
  @media(max-width:700px){.item-facts{grid-template-columns:1fr}.item-form{grid-template-columns:1fr 1fr}.item-form .input:nth-child(3){grid-column:1/-1}.item-form button{grid-column:1/-1}}
</style>
</head>
<body class="apple-theme" data-page="item">
<div class="bg" aria-hidden="true"></div>
<header class="topnav">
  <div class="topnav-in">
    <a class="brand" href="index.html" aria-label="bitsettled home">
      <span class="brand-mark" aria-hidden="true">S</span>
      <span class="brand-copy"><b>bit-settled</b><small>barter board</small></span>
    </a>
    <details class="nav-board" id="navBoard">
      <summary>Barter Board <span aria-hidden="true">▾</span></summary>
      <div class="nav-board-menu" id="boardMenuList">
        <a href="index.html">All active boards</a>
        <a href="category.html?c=audio">Audio</a>
        <a href="category.html?c=lighting">Lighting</a>
        <a href="category.html?c=gadgets">Gadgets</a>
        <a href="category.html?c=general">General</a>
        <a href="index.html#offerCompose">Post an item</a>
      </div>
    </details>
    <form class="nav-search" id="navSearchForm" role="search">
      <input id="navSearch" type="search" placeholder="Search offers, wants, merchants…" aria-label="Search offers">
      <button type="submit" aria-label="Search">Search</button>
    </form>
    
  </div>
</header>
<main class="shell item-wrap">
  <div id="itemBody"><div class="panel cat-empty" style="padding:24px">Loading negotiation…</div></div>
  <div class="legal-footer"><a href="index.html">Board</a><a href="about.html">About</a><a href="api.html">API</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></div>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="nav.js"></script>
<script src="item.js"></script>
</body>
</html>
